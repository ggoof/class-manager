# Render blueprint for the API. `render.yaml` in the repo root lets Render's
# "New > Blueprint" wire the service up without clicking through the dashboard.
#
# The two secret values are marked `sync: false`, so Render prompts for
# them on first deploy instead of storing them in git:
#
#   JWT_SECRET                node -e "console.log(require('crypto').randomBytes(48).toString('hex'))"
#   FIREBASE_SERVICE_ACCOUNT  the service-account key, base64-encoded
services:
  - type: web
    name: class-manager-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FIREBASE_PROJECT_ID
        value: futuretelling-d14bf
      # Class times are wall-clock values expanded in server-local time, and
      # Render runs in UTC; pin the school's zone.
      - key: TZ
        value: America/Los_Angeles
      - key: CORS_ORIGIN
        value: https://futuretelling-d14bf.web.app,https://futuretelling-d14bf.firebaseapp.com
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: JWT_SECRET
        sync: false
